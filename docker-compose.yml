version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Lima
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_PROCESS=main
    depends_on:
      - travel_ai
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - n8n_net

  travel_ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: travel_ai
    restart: always
    ports:
      - "8002:8002"
    networks:
      - n8n_net

networks:
  n8n_net:
    driver: bridge

